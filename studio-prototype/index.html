<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxshot Gateway</title>
<style>
  :root {
    --gw-bg: #f6f6f1; --gw-sidebar: #ffffff; --gw-border: #e6e6e0; --gw-text: #1a1a1a;
    --gw-muted: #8b8b86; --gw-accent: #3fa34d; --gw-accent-soft: #e8f5ea; --gw-dark-badge: #17181b;
  }
  :root[data-shell-theme="dark"] {
    --gw-bg: #16171a; --gw-sidebar: #1c1d21; --gw-border: #2c2d31; --gw-text: #eceef0;
    --gw-muted: #8c8d92; --gw-accent: #4cbf5e; --gw-accent-soft: rgba(76,191,94,0.14); --gw-dark-badge: #000;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--gw-bg); color: var(--gw-text); overflow: hidden; }
  button, input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--gw-border); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app-shell { display: flex; height: 100vh; }

  /* Sidebar */
  .gw-sidebar { width: 240px; flex-shrink: 0; background: var(--gw-sidebar); border-right: 1px solid var(--gw-border); display: flex; flex-direction: column; padding: 18px 14px; }
  .gw-logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .gw-logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--gw-text); color: var(--gw-sidebar); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .gw-logo-text b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.2; }
  .gw-logo-text span { display: block; font-size: 11.5px; color: var(--gw-muted); }
  .gw-nav { display: flex; flex-direction: column; gap: 2px; }
  .gw-nav-item {
    display: flex; align-items: center; gap: 10px; border: none; background: transparent; color: #555;
    padding: 9px 10px; border-radius: 9px; font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left;
  }
  [data-shell-theme="dark"] .gw-nav-item { color: #aaa; }
  .gw-nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
  .gw-nav-item:hover { background: var(--gw-bg); }
  .gw-nav-item.active { background: var(--gw-accent-soft); color: var(--gw-accent); font-weight: 600; }
  .gw-nav-gap { height: 10px; }
  .gw-nav-divider { height: 1px; background: var(--gw-border); margin: 12px 4px; }
  .gw-search-row { display: flex; gap: 8px; margin-top: 4px; }
  .gw-search-row input {
    flex: 1; border: 1px solid var(--gw-border); background: var(--gw-bg); border-radius: 9px;
    padding: 8px 12px; font-size: 12.5px; color: var(--gw-text); outline: none;
  }
  .gw-search-row button {
    width: 34px; border: 1px solid var(--gw-border); background: var(--gw-bg); border-radius: 9px;
    color: var(--gw-muted); cursor: pointer; font-size: 16px;
  }
  .gw-conv-list { margin-top: 12px; overflow-y: auto; flex: 1; }
  .gw-conv-item { padding: 9px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  .gw-conv-item:hover { background: var(--gw-bg); }
  .gw-conv-item .t { display: block; color: var(--gw-text); margin-bottom: 2px; }
  .gw-conv-item .d { color: var(--gw-muted); font-size: 11px; }

  /* Main / topbar */
  .gw-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .gw-topbar { height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid var(--gw-border); }
  .gw-model-select {
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--gw-border); background: var(--gw-sidebar);
    border-radius: 20px; padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--gw-text);
  }
  .gw-model-select svg { width: 12px; height: 12px; opacity: 0.6; }
  .gw-topbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .gw-lang-toggle, .gw-theme-toggle { display: flex; border: 1px solid var(--gw-border); border-radius: 20px; padding: 3px; background: var(--gw-sidebar); }
  .gw-lang-toggle button, .gw-theme-toggle button {
    border: none; background: transparent; color: var(--gw-muted); width: 34px; height: 30px; border-radius: 16px;
    cursor: pointer; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; justify-content: center;
  }
  .gw-lang-toggle button svg, .gw-theme-toggle button svg { width: 15px; height: 15px; }
  .gw-lang-toggle button.active, .gw-theme-toggle button.active { background: var(--gw-accent-soft); color: var(--gw-accent); box-shadow: inset 0 0 0 1px var(--gw-accent); }
  .gw-credits { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gw-text); padding: 0 6px; }
  .gw-credits svg { width: 14px; height: 14px; color: var(--gw-muted); }
  .gw-wallet { display: flex; align-items: center; gap: 7px; background: var(--gw-dark-badge); color: #fff; border-radius: 20px; padding: 8px 14px; font-size: 12.5px; }
  .gw-wallet .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gw-accent); }

  .gw-view-wrap { flex: 1; min-height: 0; position: relative; }
  .gw-view { position: absolute; inset: 0; overflow-y: auto; }
  .gw-view.hidden { display: none; }

  /* New Chat hero */
  .gw-hero { max-width: 720px; margin: 90px auto 0; padding: 0 24px; }
  .gw-hero .eyebrow { font-size: 12px; letter-spacing: 2px; color: var(--gw-muted); font-weight: 600; margin-bottom: 10px; }
  .gw-hero h1 { font-size: 48px; font-weight: 800; margin: 0 0 34px; letter-spacing: -1px; }
  .gw-chatbox { border: 1px solid var(--gw-border); background: var(--gw-sidebar); border-radius: 18px; padding: 4px; }
  .gw-chatbox textarea {
    width: 100%; border: none; background: transparent; resize: none; outline: none; padding: 18px 18px 8px;
    font-size: 15px; color: var(--gw-text); min-height: 54px; font-family: inherit;
  }
  .gw-chatbox-footer { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 10px; }
  .gw-chatbox-footer .tag { font-size: 12px; color: var(--gw-muted); padding: 0 6px; }
  .gw-chatbox-icons { display: flex; gap: 6px; }
  .gw-icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--gw-border); background: var(--gw-bg);
    color: var(--gw-muted); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .gw-icon-btn svg { width: 15px; height: 15px; }
  .gw-icon-btn.send { background: var(--gw-text); color: var(--gw-sidebar); border-color: var(--gw-text); }

  /* Simple placeholder pages */
  .gw-page { max-width: 760px; margin: 0 auto; padding: 40px 24px 60px; }
  .gw-page h1 { font-size: 22px; margin: 0 0 22px; }
  .gw-card { background: var(--gw-sidebar); border: 1px solid var(--gw-border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .gw-card h3 { font-size: 13.5px; margin: 0 0 14px; }
  .gw-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--gw-border); font-size: 13px; }
  .gw-row:last-child { border-bottom: none; }
  .gw-row span:first-child { color: var(--gw-muted); }
  .gw-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .gw-stat { background: var(--gw-sidebar); border: 1px solid var(--gw-border); border-radius: 14px; padding: 18px; text-align: center; }
  .gw-stat b { display: block; font-size: 22px; }
  .gw-stat span { font-size: 12px; color: var(--gw-muted); }
  .gw-btn { border: 1px solid var(--gw-border); background: var(--gw-bg); color: var(--gw-text); border-radius: 20px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .gw-btn.primary { background: var(--gw-accent); border-color: var(--gw-accent); color: #fff; }
  .gw-code { background: var(--gw-bg); border: 1px solid var(--gw-border); border-radius: 10px; padding: 12px 14px; font-family: ui-monospace, monospace; font-size: 12px; color: var(--gw-text); overflow-x: auto; }

  /* ================= Studio canvas: scoped dark theme, ported from the Studio module ================= */
  .studio-canvas {
    --bg: #0a0a0f; --panel: #14141c; --panel-2: #1a1a24; --border: #262632; --border-2: #34343f;
    --text: #eceef2; --muted: #8b8b9a; --muted-2: #5f5f6d; --accent: #8b5cf6; --accent-ink: #f3eeff;
    --accent-soft: rgba(139,92,246,0.14); --video: #22d3ee; --video-soft: rgba(34,211,238,0.14); --danger: #f0554a;
    background: var(--bg); color: var(--text); border-radius: 18px; padding: 22px 24px 40px; min-height: calc(100vh - 60px);
  }
  /* Auto light (day) palette — follows the same dark/light/system toggle in the top bar */
  [data-shell-theme="light"] .studio-canvas {
    --bg: #f2f2ec; --panel: #ffffff; --panel-2: #f5f5f0; --border: #e4e4dc; --border-2: #d4d4c8;
    --text: #1a1a17; --muted: #7c7c73; --muted-2: #9a9a90; --accent: #7c3aed; --accent-ink: #4c1d95;
    --accent-soft: #efe8fe; --video: #0891b2; --video-soft: #e0f6fb; --danger: #dc2626;
  }
  [data-shell-theme="light"] .studio-canvas .card .badge,
  [data-shell-theme="light"] .studio-canvas .card .duration,
  [data-shell-theme="light"] .studio-canvas .icon-btn { color: #fff; }
  [data-shell-theme="light"] .modal-overlay {
    --bg: #f2f2ec; --panel: #ffffff; --panel-2: #f5f5f0; --border: #e4e4dc; --border-2: #d4d4c8;
    --text: #1a1a17; --muted: #7c7c73; --muted-2: #9a9a90; --accent: #7c3aed; --accent-ink: #4c1d95;
    --accent-soft: #efe8fe; --danger: #dc2626; --video: #0891b2;
  }
  [data-shell-theme="light"] .toast { background: #ffffff; border-color: #e4e4dc; color: #1a1a17; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
  .studio-canvas .st-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .studio-canvas .mode-switch { display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
  .studio-canvas .mode-switch button { border: none; background: transparent; color: var(--muted); padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .studio-canvas .mode-switch button.active.image { background: var(--accent-soft); color: var(--accent-ink); }
  .studio-canvas .mode-switch button.active.video { background: var(--video-soft); color: var(--video); }

  .studio-canvas .composer-card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin: 0 auto 26px; max-width: 900px; }
  .studio-canvas .tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
  .studio-canvas .tab-btn { border: none; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 9px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .studio-canvas .tab-btn:hover { background: var(--panel-2); color: var(--text); }
  .studio-canvas .tab-btn.active { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-2); }

  .studio-canvas .upload-row { display: none; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .studio-canvas .upload-row.show { display: flex; }
  .studio-canvas .upload-box { width: 96px; height: 96px; border-radius: 12px; border: 1.5px dashed var(--border-2); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted-2); font-size: 11px; cursor: pointer; flex-shrink: 0; position: relative; background: var(--bg); text-align: center; gap: 4px; overflow: hidden; }
  .studio-canvas .upload-box:hover { border-color: var(--accent); color: var(--accent-ink); }
  .studio-canvas .upload-thumb { width: 96px; height: 96px; border-radius: 12px; flex-shrink: 0; position: relative; overflow: hidden; border: 1px solid var(--border-2); background: var(--bg); cursor: default; }
  .studio-canvas .upload-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .studio-canvas .upload-thumb .thumb-remove { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--danger); color: #fff; border: 2px solid var(--panel); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .studio-canvas .upload-thumb .thumb-settings { position: absolute; bottom: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(10,10,15,0.65); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .studio-canvas .upload-thumb .thumb-settings svg { width: 13px; height: 13px; }
  .studio-canvas .upload-count { font-size: 11.5px; color: var(--muted-2); }
  .studio-canvas .upload-hint { font-size: 12px; color: var(--muted-2); align-self: center; max-width: 320px; }
  .studio-canvas #audioDescRow label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }

  .studio-canvas .chip { font-size: 12px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-2); background: var(--bg); color: var(--muted); cursor: pointer; }
  .studio-canvas .chip:hover { color: var(--text); border-color: var(--accent); }
  .studio-canvas .chip.active { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

  .studio-canvas textarea.prompt { width: 100%; min-height: 60px; resize: vertical; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 12px 14px; font-size: 14px; line-height: 1.5; outline: none; font-family: inherit; }
  .studio-canvas textarea.prompt:focus { border-color: var(--accent); }

  .studio-canvas .toolbar { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .studio-canvas .toolbar-spacer { flex: 1; }
  .studio-canvas .cost-hint { display: flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 13px; color: var(--text); font-weight: 600; }
  .studio-canvas .cost-hint svg { width: 14px; height: 14px; color: #f5b942; flex-shrink: 0; }
  .studio-canvas .pill-wrap { position: relative; }
  .studio-canvas .pill { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); border-radius: 20px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap; font-weight: 500; }
  .studio-canvas .pill:hover { border-color: var(--border-2); color: var(--text); }
  .studio-canvas .pill.open { border-color: var(--accent); color: var(--text); }
  .studio-canvas .pill svg { width: 14px; height: 14px; flex-shrink: 0; }
  .studio-canvas .pill .chev { width: 10px; height: 10px; opacity: 0.6; transition: transform .15s ease; }
  .studio-canvas .pill.open .chev { transform: rotate(180deg); }
  .studio-canvas .pill.pill-icon-only { padding: 7px 9px; }

  .studio-canvas .pill-pop { display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 12px; padding: 14px; min-width: 220px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
  .studio-canvas .pill-pop.show { display: block; }
  .studio-canvas .pill-pop.right { left: auto; right: 0; }
  .studio-canvas .pill-pop label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
  .studio-canvas .pill-pop .row-between { display: flex; justify-content: space-between; }
  .studio-canvas .pill-pop .val { color: var(--text); font-weight: 600; }

  .studio-canvas .send-btn { width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), #a78bfa); color: #0a0a0f; display: flex; align-items: center; justify-content: center; }
  .studio-canvas .send-btn.video-mode { background: linear-gradient(135deg, var(--video), #67e8f9); }
  .studio-canvas .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .studio-canvas .send-btn:active:not(:disabled) { transform: scale(0.94); }

  .studio-canvas select.pfield, .studio-canvas input.pfield { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 9px; font-size: 13px; outline: none; }
  .studio-canvas select.pfield:focus, .studio-canvas input.pfield:focus { border-color: var(--accent); }
  .studio-canvas .ar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; min-width: 220px; }
  .studio-canvas .ar-btn { border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 9px; padding: 8px 4px; font-size: 11.5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .studio-canvas .ar-btn .sw { border: 1.5px solid var(--muted); }
  .studio-canvas .ar-btn.active { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .studio-canvas .ar-btn.active .sw { border-color: var(--accent-ink); }
  .studio-canvas input[type=range] { width: 100%; accent-color: var(--accent); }

  .studio-canvas .menu-list { display: flex; flex-direction: column; gap: 2px; min-width: 200px; }
  .studio-canvas .menu-item { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: none; background: transparent; color: var(--muted); border-radius: 8px; padding: 9px 10px; font-size: 13px; cursor: pointer; }
  .studio-canvas .menu-item:hover { background: var(--bg); color: var(--text); }
  .studio-canvas .menu-item.active { background: var(--accent-soft); color: var(--accent-ink); }
  .studio-canvas .menu-item .check { width: 14px; height: 14px; opacity: 0; }
  .studio-canvas .menu-item.active .check { opacity: 1; }
  .studio-canvas .video-only, .studio-canvas .strength-only { display: none; }
  .studio-canvas .video-only.show, .studio-canvas .strength-only.show { display: block; }

  .studio-canvas .gallery-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; max-width: 900px; margin-left: auto; margin-right: auto; }
  .studio-canvas .gallery-header h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .studio-canvas .gallery-header span { font-size: 12px; color: var(--muted-2); }
  .studio-canvas .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; max-width: 900px; margin: 0 auto; }
  .studio-canvas .card { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--panel); cursor: pointer; aspect-ratio: 1 / 1; }
  .studio-canvas .card .thumb { width: 100%; height: 100%; }
  .studio-canvas .card .badge { position: absolute; top: 8px; left: 8px; font-size: 10.5px; padding: 3px 8px; border-radius: 20px; background: rgba(10,10,15,0.6); color: #fff; }
  .studio-canvas .card .duration { position: absolute; bottom: 8px; right: 8px; font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: rgba(10,10,15,0.7); color: #fff; }
  .studio-canvas .card .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .studio-canvas .card .play svg { width: 34px; height: 34px; opacity: 0.9; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .studio-canvas .card .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent 55%); opacity: 0; transition: opacity .15s; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .studio-canvas .card:hover .overlay { opacity: 1; }
  .studio-canvas .card .cap { font-size: 11px; color: #eee; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .studio-canvas .card .actions { display: flex; gap: 5px; }
  .studio-canvas .icon-btn { width: 26px; height: 26px; border-radius: 7px; border: none; background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .studio-canvas .icon-btn:hover { background: rgba(255,255,255,0.28); }
  .studio-canvas .icon-btn svg { width: 14px; height: 14px; }
  .studio-canvas .card.skeleton { background: linear-gradient(100deg, var(--panel) 30%, var(--panel-2) 50%, var(--panel) 70%); background-size: 200% 100%; animation: st-shimmer 1.1s infinite; cursor: default; }
  @keyframes st-shimmer { to { background-position: -200% 0; } }

  .studio-canvas .view-title { font-size: 18px; font-weight: 600; margin: 4px auto 18px; max-width: 900px; }
  .studio-canvas .filter-row { display: flex; gap: 8px; margin: 0 auto 16px; max-width: 900px; }

  /* Inline editing — editing happens in the same composer card used for generation, no popup */
  .studio-canvas .edit-bar { display: none; align-items: center; gap: 10px; margin-bottom: 16px; }
  .studio-canvas .edit-bar.show { display: flex; }

  .close-modal { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 50%; background: rgba(10,10,15,0.6); border: none; color: #fff; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; font-size: 18px; }

/* ---------------- popovers ---------------- */
function closeAllPopovers() {
  document.querySelectorAll('.pill-pop').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.plus-pop').forEach(p => p.classList.remove('show'));
}
function wirePopover(btnId, popId) {
  const btn = $(btnId), pop = $(popId);
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = pop.classList.contains('show');
    closeAllPopovers();
    if (!isOpen) {
      pop.classList.add('show');
      btn.classList.add('open');
      pop.style.maxHeight = ''; pop.style.overflowY = '';
      const btnRect = btn.getBoundingClientRect();
      const popRect = pop.getBoundingClientRect();
      const spaceBelow = window.innerHeight - btnRect.bottom - 16;
      const spaceAbove = btnRect.top - 16;
      const openUp = popRect.height > spaceBelow && spaceAbove > spaceBelow;
      const available = openUp ? spaceAbove : spaceBelow;
      if (openUp) { pop.style.top = 'auto'; pop.style.bottom = 'calc(100% + 8px)'; }
      else { pop.style.bottom = 'auto'; pop.style.top = 'calc(100% + 8px)'; }
      if (popRect.height > available) { pop.style.maxHeight = Math.max(120, available) + 'px'; pop.style.overflowY = 'auto'; }
    }
  });
  pop.addEventListener('click', e => e.stopPropagation());
}
document.addEventListener('click', () => closeAllPopovers());
['modelPillBtn|modelPop', 'aspectResPillBtn|aspectResPop', 'durationPillBtn|durationPop',
 'strengthPillBtn|strengthPop', 'stylePillBtn|stylePop', 'audioPillBtn|audioPop'].forEach(pair => {

function handleFiles(fileList) {
  const remaining = MAX_UPLOADS - state.uploadedImgs.length;
  if (remaining <= 0) { toast(t('maxUploadsToast')); return; }
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/')).slice(0, remaining);
  if (!files.length) return;
  if (fileList.length > files.length) toast(t('maxUploadsKeptToast') + ' ' + files.length);
  let loaded = 0;
  files.forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => { state.uploadedImgs.push({ src: ev.target.result, isGradient: false }); loaded++; if (loaded === files.length) renderUploadThumbs(); };
    reader.readAsDataURL(f);
  });
}
$('fileInput').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });

function renderStyles() {
  const wrap = $('styleGrid');
  wrap.innerHTML = '';
  const currentStyle = STYLES.find(s => s.key === state.style) || STYLES[0];
  $('stylePillLabel').textContent = currentStyle[uiLang];
  STYLES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'ar-btn' + (s.key === state.style ? ' active' : '');
    b.style.gridTemplateColumns = '1fr';
    b.textContent = s[uiLang];
    b.addEventListener('click', () => { state.style = s.key; $('stylePillLabel').textContent = s[uiLang]; renderStyles(); closeAllPopovers(); });
    wrap.appendChild(b);
  });
}
$('durationRange').addEventListener('input', () => { $('durationVal').textContent = $('durationRange').value + 's'; $('durationPillLabel').textContent = $('durationRange').value + 's'; });
$('strengthRange').addEventListener('input', () => { $('strengthVal').textContent = $('strengthRange').value + '%'; $('strengthPillLabel').textContent = $('strengthRange').value + '%'; });

/* ---------------- generate ---------------- */
function costFor() { return state.mode === 'video' ? 8000 : 2000; }
const EDIT_COST = 2000, EXTEND_COST = 4000;
function costBadgeHTML(cost) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.3c0-1.3-1.3-2.3-3-2.3s-3 .9-3 2c0 2.8 6 1.3 6 4.1 0 1.1-1.3 2-3 2s-3-1-3-2.3"/></svg>' +
    '<span>' + cost.toLocaleString() + '</span>';
}
function updateCostHint() {
  const el = $('costHint'); if (!el) return;
  const cost = state.editing ? (state.editing.type === 'video' ? EXTEND_COST : EDIT_COST) : costFor();
  el.innerHTML = costBadgeHTML(cost);
}
function arRatioCss() { const a = ASPECTS.find(x => x.id === state.aspect) || ASPECTS[0]; return a.w + ' / ' + a.h; }

$('generateBtn').addEventListener('click', e => {
  e.stopPropagation();
  closeAllPopovers();
  if (state.editing) { handleEditApply(); return; }
  handleGenerate();
});

function handleGenerate() {
  const prompt = $('promptInput').value.trim();
  const needsUpload = state.tab === 'img2img' || state.tab === 'img2vid';
  if (needsUpload && state.uploadedImgs.length === 0) { toast(t('needUploadToast')); return; }
  if (!prompt && !needsUpload) { toast(t('needPromptToast')); return; }
  const cost = costFor();
  if (shell.credits < cost) { toast(t('notEnoughCreditsToast') + ' ' + formatK(cost)); return; }

  const grid = $('galleryGrid');
  const btn = $('generateBtn');
  btn.disabled = true;
  const sk = document.createElement('div');
  sk.className = 'card skeleton';
  sk.style.aspectRatio = arRatioCss();
  grid.prepend(sk);
  updateGalleryCount();

  setTimeout(() => {
    shell.credits -= cost;
    updateShellCredits();
    const asset = makeAsset(prompt);
    const card = buildCard(asset);
    sk.replaceWith(card);
    updateGalleryCount();
    btn.disabled = false;
    toast(t('generateCompleteToast') + ' — ' + t('usedToast') + ' ' + formatK(cost) + ' ' + t('creditsWord'));
  }, 1400 + Math.random() * 500);
}

let assetSeq = 1;
function makeAsset(prompt) {
  const isVideo = state.mode === 'video';
  const asset = {
    id: assetSeq++, type: isVideo ? 'video' : 'image', gradient: GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)],
    aspect: state.aspect, prompt: prompt, duration: isVideo ? $('durationRange').value + 's' : null, model: state.model,
    audio: isVideo ? state.audio === 'on' : false,
    audioDesc: isVideo && state.audio === 'on' ? $('audioDescInput').value.trim() : '',
  };
  state.assets.unshift(asset);
  return asset;
}
function updateGalleryCount() { const el = $('galleryCount'); if (el) el.textContent = state.assets.length + ' ' + t('results'); }

/* ---------------- gallery card ---------------- */
function buildCard(asset) {
  const card = document.createElement('div');
  card.className = 'card';
  const a = ASPECTS.find(x => x.id === asset.aspect) || ASPECTS[0];
  card.style.aspectRatio = a.w + ' / ' + a.h;
  card.dataset.id = asset.id;
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  thumb.style.background = asset.gradient;
  card.appendChild(thumb);
  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.textContent = asset.type === 'video' ? t('videoBadge') : t('imageBadge');
  card.appendChild(badge);
  if (asset.type === 'video') {
    const play = document.createElement('div');
    play.className = 'play';
    play.innerHTML = '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.35)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>';
    card.appendChild(play);
    const dur = document.createElement('div');
    dur.className = 'duration';
    dur.style.display = 'flex'; dur.style.alignItems = 'center'; dur.style.gap = '3px';
    dur.innerHTML = (asset.audio ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>' : '') + '<span>' + asset.duration + '</span>';
    card.appendChild(dur);
  }
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = '<div class="cap">' + escapeHtml(asset.prompt) + '</div><div class="actions"></div>';
  const actions = overlay.querySelector('.actions');
  actions.appendChild(iconBtn('download', downloadIcon(), () => toast(t('downloadedToast'))));
  actions.appendChild(iconBtn('edit', editIcon(), () => enterEditMode(asset)));
  if (asset.type === 'image') {
    actions.appendChild(iconBtn('animate', filmIcon(), () => jumpToImageToVideo(asset)));
  }
  actions.appendChild(iconBtn('delete', trashIcon(), () => {
    card.remove();
    state.assets = state.assets.filter(a2 => a2.id !== asset.id);
    updateGalleryCount();
  }));
  card.appendChild(overlay);
  card.addEventListener('click', () => enterEditMode(asset));
  return card;
}
function jumpToImageToVideo(asset) {
  if (state.editing) exitEditMode();
  state.mode = 'video'; state.tab = 'img2vid';
  state.uploadedImgs = [{ src: asset.gradient, isGradient: true }];
  document.querySelectorAll('.mode-switch button').forEach(b => b.classList.toggle('active', b.dataset.mode === 'video'));
  renderTabs(); populateModels(); updateComposerForTab();
  document.querySelectorAll('.gw-nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'studio'));
  SHELL_VIEWS.forEach(v => $('view-' + v).classList.toggle('hidden', v !== 'studio'));
  $('gwModelSelect').style.display = 'none';
  toast(t('setAsVideoRefToast'));
  $('view-studio').scrollTo({ top: 0, behavior: 'smooth' });
}
function iconBtn(name, svg, onClick) {
  const b = document.createElement('button');
  b.className = 'icon-btn'; b.innerHTML = svg; b.title = name;
  b.addEventListener('click', e => { e.stopPropagation(); onClick(e); });
  return b;
}
function downloadIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M6 11l6 6 6-6M4 21h16"/></svg>';}
function editIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';}
function filmIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>';}
function trashIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>';}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ---------------- My Creations ---------------- */
function renderCreationsGrid(filter) {
  const activeChip = document.querySelector('#creationsCanvas .filter-row .chip.active');
  filter = filter || (activeChip ? activeChip.dataset.filter : 'all');
  if (!$('creationsGrid')) {
    $('creationsCanvas').innerHTML = `
      <div class="view-title" id="creationsTitle"></div>
      <div class="filter-row">
        <button class="chip active" data-filter="all"></button>
        <button class="chip" data-filter="image"></button>
        <button class="chip" data-filter="video"></button>
      </div>
      <div class="gallery-grid" id="creationsGrid"></div>
    `;
    $('creationsCanvas').querySelectorAll('.filter-row .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        $('creationsCanvas').querySelectorAll('.filter-row .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderCreationsGrid(chip.dataset.filter);
      });
    });
  }
  $('creationsTitle').textContent = t('myCreationsTitle');
  const chips = $('creationsCanvas').querySelectorAll('.filter-row .chip');
  chips[0].textContent = t('filterAll'); chips[1].textContent = t('filterImages'); chips[2].textContent = t('filterVideos');
  const grid = $('creationsGrid');
  grid.innerHTML = '';
  const list = state.assets.filter(a => filter === 'all' || a.type === filter);
  if (!list.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;color:var(--muted-2);font-size:13px;padding:40px 0;text-align:center;">' + t('emptyCreations') + '</div>';
    return;
  }
  list.forEach(a => grid.appendChild(buildCard(a)));
}

/* ---------------- unified "+" picker: same mechanism for generation references and editing sources ---------------- */
let pickerOnSelect = null;
function openAssetPicker(assetType, onSelect) {
  pickerOnSelect = onSelect;
  renderPickerGrid(assetType);
  $('assetPickerOverlay').classList.add('show');
}
function renderPickerGrid(assetType) {
  const grid = $('pickerGrid');
  grid.innerHTML = '';
  const list = state.assets.filter(a => a.type === assetType);
  if (!list.length) {
    grid.innerHTML = '<div class="picker-empty">' + (assetType === 'video' ? t('pickerEmptyVideo') : t('pickerEmptyImage')) + '</div>';
    return;
  }
  list.forEach(asset => {
    const card = document.createElement('div');
    card.className = 'picker-card';
    const badgeText = asset.type === 'video' ? t('videoBadge') : t('imageBadge');
    card.innerHTML = '<div class="thumb" style="background:' + asset.gradient + '"></div><div class="badge">' + badgeText + '</div>' +
      (asset.type === 'video' ? '<div class="play"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="10" fill="rgba(0,0,0,0.35)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg></div>' : '');
    card.addEventListener('click', () => {
      $('assetPickerOverlay').classList.remove('show');
      if (pickerOnSelect) pickerOnSelect(asset);
    });
    grid.appendChild(card);
  });
}
$('closeAssetPicker').addEventListener('click', () => $('assetPickerOverlay').classList.remove('show'));
$('assetPickerOverlay').addEventListener('click', e => { if (e.target === $('assetPickerOverlay')) $('assetPickerOverlay').classList.remove('show'); });

/* ---------------- inline editing: editing happens in the same composer used for generation ---------------- */
let editDrawing = false, editImageTool = null;

function enterEditMode(asset) {
  state.editing = asset;
  editImageTool = null;
  closeAllPopovers();

  document.querySelectorAll('.gw-nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === 'studio'));
  SHELL_VIEWS.forEach(v => $('view-' + v).classList.toggle('hidden', v !== 'studio'));
  $('gwModelSelect').style.display = 'none';

  $('stTopbar').style.display = 'none';
  $('tabs').style.display = 'none';
  $('uploadRow').classList.remove('show');
  $('genPills').style.display = 'none';

  const isVideo = asset.type === 'video';
  $('editBar').classList.add('show');
  $('editPreviewWrap').classList.add('show');
  $('editToolsRow').classList.toggle('show', !isVideo);
  $('editTrimBlock').classList.toggle('show', isVideo);
  $('editBrushRow').classList.remove('show');
  document.querySelectorAll('#editToolsRow .chip').forEach(c => c.classList.remove('active'));

  $('editBarTitle').textContent = (isVideo ? t('videoResultTitle') : t('imageResultTitle')) + '  ·  ' + asset.model + '  ·  ' + asset.aspect + (asset.duration ? '  ·  ' + asset.duration : '');

  renderEditPreview(asset);

  $('promptInput').value = '';
  $('promptInput').placeholder = isVideo ? t('extendPlaceholder') : t('editImgPlaceholder');
  $('generateBtn').classList.toggle('video-mode', isVideo);
  if (isVideo) initTrim(parseInt(asset.duration, 10) || 6);
  updateCostHint();

  $('view-studio').scrollTo({ top: 0, behavior: 'smooth' });
}

function exitEditMode() {
  state.editing = null;
  $('editBar').classList.remove('show');
  $('editPreviewWrap').classList.remove('show');
  $('editToolsRow').classList.remove('show');
  $('editTrimBlock').classList.remove('show');
  $('editBrushRow').classList.remove('show');
  $('stTopbar').style.display = '';
  $('tabs').style.display = '';
  $('genPills').style.display = 'contents';
  $('promptInput').value = '';
  renderTabs();
  updateComposerForTab();
  $('generateBtn').classList.toggle('video-mode', state.mode === 'video');
}

function renderEditPreview(asset) {
  const surf = $('editSurf');
  const a = ASPECTS.find(x => x.id === asset.aspect) || ASPECTS[0];
  const maxDim = 260;
  let w, h;
  if (a.w >= a.h) { w = maxDim; h = Math.round(maxDim * a.h / a.w); } else { h = maxDim; w = Math.round(maxDim * a.w / a.h); }
  surf.style.width = w + 'px'; surf.style.height = h + 'px'; surf.style.borderRadius = '12px';
  surf.style.background = asset.gradient;
  surf.style.display = 'flex'; surf.style.alignItems = 'center'; surf.style.justifyContent = 'center';
  surf.innerHTML = asset.type === 'video' ? '<svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.35)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>' : '';
  const mask = $('editMaskLayer');
  mask.width = w; mask.height = h; mask.style.width = w + 'px'; mask.style.height = h + 'px';
  mask.getContext('2d').clearRect(0, 0, w, h);
  mask.classList.remove('active');
}

$('editExitBtn').addEventListener('click', () => exitEditMode());
$('editDownloadBtn').addEventListener('click', () => toast(t('downloadedToast')));
$('editDeleteBtn').addEventListener('click', () => {
  const asset = state.editing;
  state.assets = state.assets.filter(a => a.id !== asset.id);
  document.querySelectorAll('.card').forEach(c => { if (String(c.dataset.id) === String(asset.id)) c.remove(); });
  updateGalleryCount();
  exitEditMode();
  toast(t('deletedToast'));
});

document.querySelectorAll('#editToolsRow .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    const tool = btn.dataset.tool;
    const asset = state.editing;
    if (tool === 'animate') { jumpToImageToVideo(asset); return; }
    if (tool === 'upscale') { toast(t('upscaledToast') + ' ' + (state.resolution === '2k' ? '4K' : '2K')); return; }

    const turningOn = editImageTool !== tool;
    editImageTool = turningOn ? tool : null;
    document.querySelectorAll('#editToolsRow .chip').forEach(c => c.classList.remove('active'));
    if (turningOn) btn.classList.add('active');
    $('editMaskLayer').classList.toggle('active', editImageTool === 'inpaint');
    $('editBrushRow').classList.toggle('show', editImageTool === 'inpaint');

    if (tool === 'removebg') {
      if (turningOn) {
        $('editSurf').style.backgroundImage = 'repeating-conic-gradient(#2a2a34 0% 25%, #1a1a22 0% 50%)';
        $('editSurf').style.backgroundSize = '16px 16px';
        setTimeout(() => toast(t('bgRemovedToast')), 300);
      } else {
        $('editSurf').style.backgroundImage = 'none';
        $('editSurf').style.background = asset.gradient;
      }
    }
    if (tool === 'inpaint' && turningOn) toast(t('inpaintToast'));
  });
});

/* ---------------- trim: pick a clip (2-10s) of the source video before continuing ---------------- */
const trimState = { total: 6, start: 0, end: 6 };
function updateTrimUI() {
  const startPct = (trimState.start / trimState.total) * 100;
  const endPct = (trimState.end / trimState.total) * 100;
  $('trimSelection').style.left = startPct + '%';
  $('trimSelection').style.width = (endPct - startPct) + '%';
  $('trimReadout').textContent = trimState.start.toFixed(1) + 's – ' + trimState.end.toFixed(1) + 's (' + (trimState.end - trimState.start).toFixed(1) + 's)';
}
function initTrim(totalSeconds) {
  trimState.total = Math.max(totalSeconds, 2);
  trimState.start = 0;
  trimState.end = Math.max(2, Math.min(trimState.total, 10, totalSeconds));
  $('audioSrcOriginal').classList.add('active');
  $('audioSrcGenerate').classList.remove('active');
  updateTrimUI();
}
function dragTrimHandle(handleEl, isStart) {
  handleEl.addEventListener('mousedown', e => {
    e.preventDefault();
    const track = $('trimTrack');
    function onMove(ev) {
      const rect = track.getBoundingClientRect();
      let pct = (ev.clientX - rect.left) / rect.width;
      pct = Math.max(0, Math.min(1, pct));
      let time = pct * trimState.total;
      if (isStart) {
        trimState.start = Math.max(0, Math.min(time, trimState.end - 2));
      } else {
        trimState.end = Math.min(trimState.total, Math.max(time, trimState.start + 2));
      }
      if (trimState.end - trimState.start > 10) {
        if (isStart) trimState.start = trimState.end - 10;
        else trimState.end = trimState.start + 10;
      }
      updateTrimUI();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}
dragTrimHandle($('trimHandleStart'), true);
dragTrimHandle($('trimHandleEnd'), false);
$('audioSrcOriginal').addEventListener('click', () => { $('audioSrcOriginal').classList.add('active'); $('audioSrcGenerate').classList.remove('active'); });
$('audioSrcGenerate').addEventListener('click', () => { $('audioSrcGenerate').classList.add('active'); $('audioSrcOriginal').classList.remove('active'); });

function handleEditApply() {
  const asset = state.editing;
  const isVideo = asset.type === 'video';
  const desc = $('promptInput').value.trim();
  if (!desc) { toast(isVideo ? t('needContinueDescToast') : t('needEditDescToast')); return; }
  const cost = isVideo ? EXTEND_COST : EDIT_COST;
  if (shell.credits < cost) { toast(t('notEnoughCreditsToast') + ' ' + formatK(cost)); return; }

  const btn = $('generateBtn');
  btn.disabled = true;
  const sk = document.createElement('div');
  sk.className = 'card skeleton';
  const a0 = ASPECTS.find(x => x.id === asset.aspect) || ASPECTS[0];
  sk.style.aspectRatio = a0.w + ' / ' + a0.h;
  $('galleryGrid').prepend(sk);
  updateGalleryCount();

  let clipLen, useGeneratedAudio;
  if (isVideo) {
    clipLen = trimState.end - trimState.start;
    useGeneratedAudio = $('audioSrcGenerate').classList.contains('active');
  }
  exitEditMode();

  setTimeout(() => {
    shell.credits -= cost;
    updateShellCredits();
    let newAsset;
    if (isVideo) {
      const newDuration = Math.round((clipLen + 4) * 10) / 10;
      newAsset = {
        id: assetSeq++, type: 'video', gradient: GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)],
        aspect: asset.aspect, prompt: desc, duration: newDuration + 's', model: asset.model,
        audio: useGeneratedAudio ? true : asset.audio,
        audioDesc: useGeneratedAudio ? desc : asset.audioDesc,
      };
    } else {
      newAsset = {
        id: assetSeq++, type: 'image', gradient: GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)],
        aspect: asset.aspect, prompt: desc, duration: null, model: asset.model, audio: false, audioDesc: '',
      };
    }
    state.assets.unshift(newAsset);
    const card = buildCard(newAsset);
    sk.replaceWith(card);
    updateGalleryCount();
    btn.disabled = false;
    toast((isVideo ? t('extendAppliedToast') : t('editAppliedToast')) + ' — ' + formatK(cost) + ' ' + t('creditsWord'));
  }, 1400 + Math.random() * 500);
}

const editMaskCanvas = $('editMaskLayer');
function editMaskPos(e) { const r = editMaskCanvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (editMaskCanvas.width / r.width), y: (e.clientY - r.top) * (editMaskCanvas.height / r.height) }; }
function paintEditAt(e) {
  const ctx = editMaskCanvas.getContext('2d');
  const p = editMaskPos(e);
  const size = parseInt($('editBrushSize').value, 10);
  ctx.fillStyle = 'rgba(139,92,246,0.55)';
  ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI * 2); ctx.fill();
}
editMaskCanvas.addEventListener('mousedown', e => { if (editImageTool !== 'inpaint') return; editDrawing = true; paintEditAt(e); });
editMaskCanvas.addEventListener('mousemove', e => { if (editDrawing && editImageTool === 'inpaint') paintEditAt(e); });
window.addEventListener('mouseup', () => { editDrawing = false; });

/* ---------------- init ---------------- */
function initStudio() {
  renderTabs(); populateModels(); renderAR(); renderStyles(); renderResGrid(); renderAudioOptions(); updateComposerForTab();
  ['Neon cyberpunk street at night', 'Minimal white product shot, softbox lighting', 'Sunrise over snow peaks', 'Vintage film-style portrait'].forEach((p, i) => {
    state.mode = i === 2 ? 'video' : 'image';
    const a = makeAsset(p);
    if (i === 2) a.duration = '6s';
    $('galleryGrid').appendChild(buildCard(a));
  });
  state.mode = 'image';
  updateGalleryCount();
  updateShellCredits();
}
initStudio();

/* ---------------- language switch: translate Studio + My Creations ---------------- */
function applyStudioLang() {
  document.querySelectorAll('[data-key]').forEach(el => {
    if (!I18N[el.dataset.key]) return;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = t(el.dataset.key);
    else el.textContent = t(el.dataset.key);
  });
  renderResGrid();
  renderAR();
  renderStyles();
  renderAudioOptions();
  if (state.editing) enterEditMode(state.editing);
  else { renderTabs(); updateComposerForTab(); }
  $('galleryTitle').textContent = t('recentGenerations');
  updateGalleryCount();
  const galleryGrid = $('galleryGrid');
  galleryGrid.innerHTML = '';
  state.assets.forEach(a => galleryGrid.appendChild(buildCard(a)));
  if ($('creationsGrid')) renderCreationsGrid();
}
$('gwLangEn').addEventListener('click', () => {
  $('gwLangEn').classList.add('active'); $('gwLangZh').classList.remove('active');
  uiLang = 'en'; applyStudioLang();
});
$('gwLangZh').addEventListener('click', () => {
  $('gwLangZh').classList.add('active'); $('gwLangEn').classList.remove('active');
  uiLang = 'zh'; applyStudioLang();
});
</script>
